name: Windows-Build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release v<Version aus tauri.conf.json> mit Installer veröffentlichen"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typprüfung & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - name: Farb-/Materialparser (Katalog)
        run: python3 ../tools/test_finish.py
      - run: npx vite build
      - name: Browser für den Oberflächentest
        run: npx playwright install --with-deps chromium
      - name: Oberflächentest (Kopfleiste 1.200–1.920 px, Designs, Dialoge)
        run: npm run ui-check

  windows:
    name: Windows-Installer (Tauri)
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Tauri-Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # Tag-Push oder manueller Auslöser mit „release“: Release anlegen (Tag v__VERSION__ erzeugt tauri-action selbst)
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release && 'v__VERSION__' || '') }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Einrichtungsplaner WE 13 {0}', github.ref_name) || (inputs.release && 'Einrichtungsplaner WE 13 v__VERSION__' || '') }}
          releaseBody: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release) && 'Windows-Installer (NSIS, .exe) und MSI. Neu in dieser Version siehe README bzw. die zugehörigen Pull Requests.' || '' }}
          releaseDraft: false
      - name: Installer als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Einrichtungsplaner-WE13-Windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
