<!doctype html>
<!--
  App-Icon 2.1 (Fluent-Stil): Haus in Petrol hinter einer Milchglasplatte mit Grundriss; Essplatz mit dunklem
  Steintisch und Taupe-Stühlen unter warmem Pendellicht, Sonnenlicht fällt schräg auf die Platte (Licht und Material).
  Rendern: node tools/icon/render_icon.cjs (Chromium, echte Hintergrundunschärfe) → tools/icon/icon_1024.png
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  .stage { position: relative; width: 1024px; height: 1024px; }
  svg { position: absolute; inset: 0; }
  .glass {
    position: absolute; left: 300px; top: 372px; width: 640px; height: 560px; border-radius: 124px;
    background: linear-gradient(160deg, rgba(255,255,255,0.66), rgba(244,250,247,0.8) 60%, rgba(236,245,241,0.9));
    backdrop-filter: blur(34px) saturate(1.5);
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.85), inset 0 -2px 0 rgba(255,255,255,0.25), inset 0 0 0 2px rgba(255,255,255,0.35), 0 34px 60px -18px rgba(8,40,36,0.55), 0 8px 18px -6px rgba(8,40,36,0.35);
    overflow: hidden;
  }
  .glass::before { /* Lichtkante oben links */
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(420px 260px at 18% 0%, rgba(255,255,255,0.55), transparent 70%);
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
      <linearGradient id="house" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3f9a86" />
        <stop offset="0.55" stop-color="#23695d" />
        <stop offset="1" stop-color="#143f39" />
      </linearGradient>
      <linearGradient id="roofhi" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
        <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2b07a" />
        <stop offset="1" stop-color="#c46a36" />
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b2b27" flood-opacity="0.38" />
      </filter>
    </defs>
    <!-- Haus: Dach + Körper mit gerundeten Ecken -->
    <path filter="url(#soft)" fill="url(#house)" d="M 452 92 Q 512 52 572 92 L 878 300 Q 914 326 914 370 L 914 704 Q 914 760 858 760 L 166 760 Q 110 760 110 704 L 110 370 Q 110 326 146 300 Z" />
    <path fill="url(#roofhi)" d="M 452 92 Q 512 52 572 92 L 878 300 Q 914 326 914 370 L 914 400 L 110 400 L 110 370 Q 110 326 146 300 Z" opacity="0.6" />
    <!-- Schornstein in Kupfer -->
    <rect x="708" y="150" width="78" height="150" rx="22" fill="url(#copper)" />
  </svg>
  <div class="glass"></div>
  <svg viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffd38a" stop-opacity="1" />
        <stop offset="0.45" stop-color="#ffc06a" stop-opacity="0.45" />
        <stop offset="1" stop-color="#ffb55a" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff4d6" stop-opacity="0.85" />
        <stop offset="1" stop-color="#ffe6b0" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3a2d25" />
        <stop offset="1" stop-color="#1c1512" />
      </linearGradient>
      <clipPath id="plate"><rect x="300" y="372" width="640" height="560" rx="124" /></clipPath>
    </defs>
    <!-- Sonnenlicht fällt schräg auf die Platte -->
    <path clip-path="url(#plate)" d="M 300 372 L 470 372 L 760 940 L 300 940 Z" fill="url(#beam)" opacity="0.55" />
    <!-- warmes Pendellicht über dem Esstisch -->
    <circle cx="715" cy="652" r="165" fill="url(#glow)" />
    <!-- Grundriss -->
    <g fill="none" stroke="#1d5149" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 410 470 L 830 470 L 830 838 L 410 838 Z" />
      <path d="M 600 470 L 600 612" />
      <path d="M 600 712 L 600 838" />
      <path d="M 410 650 L 488 650" />
    </g>
    <!-- Tür (Kupfer) -->
    <path d="M 600 618 A 92 92 0 0 0 512 708" fill="none" stroke="url(#copper)" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 20" />
    <path d="M 600 712 L 512 712" stroke="#d27c45" stroke-width="16" stroke-linecap="round" />
    <!-- Essplatz: Stühle in Taupe, dunkler Steintisch mit Ader -->
    <g fill="#a49482">
      <rect x="640" y="560" width="30" height="46" rx="12" /><rect x="640" y="630" width="30" height="46" rx="12" /><rect x="640" y="700" width="30" height="46" rx="12" />
      <rect x="760" y="560" width="30" height="46" rx="12" /><rect x="760" y="630" width="30" height="46" rx="12" /><rect x="760" y="700" width="30" height="46" rx="12" />
    </g>
    <rect x="678" y="540" width="74" height="226" rx="14" fill="url(#stone)" />
    <path d="M 690 560 C 712 610 724 640 742 700" fill="none" stroke="#c99a52" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <!-- Sofa -->
    <rect x="440" y="752" width="118" height="62" rx="22" fill="#2b7a6b" opacity="0.85" />
  </svg>
</div>
</body>
</html>
